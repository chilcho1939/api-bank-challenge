spring:
  application:
    name: transactions
  #Cada request corre en un virtual thread: las esperas I/O(proveedores, BD)
  #no bloquean threads de plataforma
  threads:
    virtual:
      enabled: true #Usar Virtual threads

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/transactions}
    username: ${DB_USER:transactions}
    password: ${DB_PASSWORD:transactions}
    hikari:
      # Con virtual threads el pool es el límite real de concurrencia hacia la BD
      # y actúa como contrapresión para proteger a Postgres. Ver ADR-0002.
      maximum-pool-size: ${DB_POOL_SIZE:20}

  jpa:
    # Evita mantener la sesión/conexión abierta durante toda la request.
    open-in-view: false
    hibernate:
      # Flyway es dueño del esquema; Hibernate solo valida que coincida.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info